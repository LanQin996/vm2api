name: docker-image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve image tags
        id: image
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/vm2api"
          {
            echo 'tags<<EOF'
            echo "${image}:sha-${GITHUB_SHA::12}"
            if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
              echo "${image}:main"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: build and push control-plane image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=vm2api-main
          cache-to: type=gha,scope=vm2api-main,mode=max
